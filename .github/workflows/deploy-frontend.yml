name: Deploy frontend to Azure Container Apps

# Builds the Next.js image, pushes it to GitHub Container Registry (free — uses
# the built-in GITHUB_TOKEN, which has package-write inside Actions), then
# deploys it to Azure Container Apps (free monthly grant, scale-to-zero).
#
# Required repo secrets:
#   AZURE_CREDENTIALS  — output of:
#     az ad sp create-for-rbac --name warmpath-deploy --role contributor \
#       --scopes /subscriptions/<SUB_ID>/resourceGroups/warmpath-rg --json-auth
#   DATABASE_URL       — Neon pooled connection string
#   DIRECT_URL         — Neon direct connection string
#   NEXTAUTH_SECRET    — random secret (openssl rand -base64 32)
#   NEXTAUTH_URL       — full public URL of the app, e.g. https://warmpath-frontend.xyz.centralindia.azurecontainerapps.io
#   AZURE_COMMUNICATION_CONNECTION_STRING — from Azure Communication Services resource (Keys tab)
#   TWENTY_API_URL  — URL of self-hosted Twenty CRM (e.g. https://twenty-crm.xyz.azurecontainerapps.io/api)
#   TWENTY_API_KEY  — API key from Twenty Settings → API & Webhooks (optional; omit if not using Twenty)
#
# One-time: make the GHCR package public (Packages → settings) so Container Apps
# can pull without registry credentials, OR add registry creds to the app.

on:
  push:
    branches: [develop]
    paths-ignore:
      - "intelligence-service/**"
      - "**/*.md"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/frontend
  RESOURCE_GROUP: warmpath-rg
  LOCATION: centralindia
  APP_NAME: warmpath-frontend
  CONTAINER_ENV: warmpath-env
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_AI_MODE=azure
            NEXT_PUBLIC_DEMO_MODE=false

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies for migrations
        run: bun install --frozen-lockfile

      - name: Run database migrations
        run: DATABASE_URL="${{ secrets.DATABASE_URL }}" DIRECT_URL="${{ secrets.DIRECT_URL }}" bunx prisma migrate deploy

      - name: Deploy to Container Apps
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az extension add --name containerapp --upgrade --only-show-errors
            az containerapp up \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --location "$LOCATION" \
              --environment "$CONTAINER_ENV" \
              --image "$IMAGE:${{ github.sha }}" \
              --target-port 3000 \
              --ingress external
            az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --min-replicas 1 \
              --max-replicas 3 \
              --set-env-vars \
                "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
                "DIRECT_URL=${{ secrets.DIRECT_URL }}" \
                "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" \
                "NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}" \
                "AUTH_TRUST_HOST=1" \
                "NEXT_PUBLIC_AI_MODE=azure" \
                "NEXT_PUBLIC_DEMO_MODE=false" \
                "AZURE_OPENAI_ENDPOINT=${{ secrets.AZURE_OPENAI_ENDPOINT }}" \
                "AZURE_OPENAI_API_KEY=${{ secrets.AZURE_OPENAI_API_KEY }}" \
                "AZURE_OPENAI_DEPLOYMENT=gpt-4.1-nano" \
                "INTELLIGENCE_SERVICE_URL=${{ secrets.INTELLIGENCE_SERVICE_URL }}" \
                "INTELLIGENCE_SERVICE_SECRET=${{ secrets.INTELLIGENCE_SERVICE_SECRET }}" \
                "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" \
                "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
                "LINKEDIN_CLIENT_ID=${{ secrets.LINKEDIN_CLIENT_ID }}" \
                "LINKEDIN_CLIENT_SECRET=${{ secrets.LINKEDIN_CLIENT_SECRET }}" \
                "AZURE_COMMUNICATION_CONNECTION_STRING=${{ secrets.AZURE_COMMUNICATION_CONNECTION_STRING }}" \
                "TWENTY_API_URL=${{ secrets.TWENTY_API_URL }}" \
                "TWENTY_API_KEY=${{ secrets.TWENTY_API_KEY }}" \
              --query properties.configuration.ingress.fqdn
